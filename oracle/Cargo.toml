[package]
name = "chelabase-time-oracle"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
chelabase-time = { path = "..", default-features = false }
# The oracles, at the fork's locked versions. Every dependency the differential tests need is
# declared here up front, so adding a test touches neither a manifest nor the lockfile.
chrono = { version = "=0.4.45", default-features = false, features = ["std", "serde"] }
humantime = "=2.2.0"
humantime-serde = "=1.1.1"
proptest = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"
